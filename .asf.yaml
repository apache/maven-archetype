# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Archetype (Plugin)"
  homepage: https://maven.apache.org/archetype/
  labels:
    - java
    - build-management
    - maven-plugins
    - maven-archetype-plugin
    - maven
    - hacktoberfest
  protected_branches:
    master: { }
    archetype-1.0.x: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - ARCHETYPE
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-archetype
project:
  metadata:
    key: maven-archetype
    committee: maven
    name: Apache Maven Archetype
    description: Maven Archetype is a set of tools to deal with archetypes, i.e. an abstract representation of a kind of project that can be instantiated into a concrete customized Maven project.
    homepage: https://maven.apache.org/archetype/
    download_page: https://maven.apache.org/archetype/download.cgi
    bug_database: https://maven.apache.org/archetype/issue-management.html
    mailing_lists: https://maven.apache.org/archetype/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-archetype
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-archetype
    download_path_suffix: archetype
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
